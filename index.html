<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#14251d" />
    <meta
      name="description"
      content="다람이와 함께 사계절을 살아남는 브라우저 생존 액션 게임. 이동하고, 성장하고, 긴 겨울을 이겨내세요."
    />
    <title>다람이의 모험 2 · Darami Adventure 2</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c3326'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='%23eed5a0' font-size='23'%3E✦%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/title.css" />
    <link rel="stylesheet" href="/src/intro.css" />
  </head>
  <body class="is-menu">
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="다람이의 모험 2 시작 화면"
        ><span class="brand-mark">✦</span
        ><span>DARAMI <b>ADVENTURE 2</b></span></a
      ><span class="edition">다람이의 모험, 그다음 이야기</span>
      <div class="top-actions">
        <button
          id="sound"
          class="icon-button"
          aria-label="소리 켜기"
          aria-pressed="false"
        >
          소리 꺼짐</button
        ><button id="help" class="icon-button" aria-label="조작법 보기">
          조작법 <span>?</span>
        </button>
      </div>
    </header>
    <main id="game-shell" class="game-shell">
      <canvas
        id="game"
        aria-label="다람이 생존 게임. WASD 또는 방향키로 이동합니다."
        tabindex="0"
      ></canvas>
      <div id="loading" class="loading">
        <span class="loader"></span>
        <p>숲을 깨우는 중…</p>
      </div>
      <section id="title-screen" class="title-screen" aria-label="게임 시작" hidden>
        <img class="title-landscape" src="/assets/prologue-spring.png" alt="봄이 찾아온 굴 입구에서 숲을 바라보는 다람이" fetchpriority="high">
        <div class="title-shade" aria-hidden="true"></div>
        <div class="title-identity">
          <p class="title-series">DARAMI ADVENTURE</p>
          <h1>다람이의<br>모험 <span>2</span></h1>
        </div>
        <div class="journey-menu">
          <div class="menu-heading"><span>모험 선택</span><span id="journey-progress">0 / 3 완료</span></div>
          <div class="mode-switch" role="group" aria-label="게임 모드">
            <button id="normal-mode" class="selected" aria-pressed="true">스토리 모드<small>다람이의 다음 이야기</small></button>
            <button id="hell-mode" aria-pressed="false" aria-disabled="true">헬 모드<small>스토리 완료 후 해금</small></button>
          </div>
          <div class="chapter-strip" role="group" aria-label="플레이할 연차"></div>
          <div class="chapter-note">
            <span class="eyebrow">1년차</span>
            <h2>귀환의 숲</h2>
            <p class="chapter-meta">봄 · 여름 · 가을 · 겨울</p>
            <p class="title-description">꿈 밖에서 발견한 익숙한 매듭</p>
          </div>
          <div class="journey-start">
            <button id="continue" class="continue-button" hidden>저장한 계절 이어하기</button>
            <button id="start" class="start-button">모험 시작 <span>↗</span></button>
          </div>
          <p id="record" class="journey-record">아직 남긴 기록이 없습니다.</p>
          <p class="menu-controls"><span><kbd>W A S D</kbd> / 방향키 이동</span><span>공격은 자동으로</span></p>
        </div>
        <span class="title-version">v0.9 · 다람이의 모험 2</span>
      </section>
      <div id="hud" class="hud" hidden>
        <div class="hud-top">
          <div class="health-box">
            <div class="hud-label">
              <b>다람이</b><span id="health-text">100 / 100</span>
            </div>
            <div class="health-track"><div id="health-fill"></div></div>
            <span id="power-label"></span>
          </div>
          <div class="season-clock">
            <span id="season-label">1년차 · 봄</span
            ><strong id="timer">05:00</strong>
            <div class="season-dots" id="season-dots">
              <i></i><i></i><i></i><i></i>
            </div>
          </div>
          <div class="kill-box">
            <span>처치</span><b id="kills">0</b
            ><button id="pause" class="icon-button" aria-label="일시정지">
              Ⅱ
            </button>
          </div>
        </div>
        <div class="xp-line">
          <span id="level">LV. 1</span>
          <div class="xp-track"><i id="xp-fill"></i></div>
          <span id="xp-text">0 / 11</span>
        </div>
        <div id="boss-hud" class="boss-hud" hidden>
          <span>겨울곰의 잔영</span>
          <div><i id="boss-fill"></i></div>
        </div>
        <div class="hud-bottom">
          <div
            id="weapon-slots"
            class="weapon-slots"
            aria-label="장착 무기"
          ></div>
          <div id="passive-slots" class="passive-slots"></div>
          <span class="pause-hint"><kbd>ESC</kbd> 일시정지</span>
        </div>
      </div>
      <div id="toast" role="status" class="toast" hidden></div>
      <div id="season-banner" class="season-banner" hidden>
        <span id="banner-en"></span><strong id="banner-name"></strong>
        <p id="banner-sub"></p>
      </div>
      <section
        id="modal"
        class="modal"
        hidden
        aria-modal="true"
        role="dialog"
        aria-labelledby="modal-title"
      >
        <div class="modal-inner" id="modal-content"></div>
      </section>
      <div class="touch-pad" id="touch-pad" hidden>
        <button data-dir="up" aria-label="위로 이동">↑</button
        ><button data-dir="left" aria-label="왼쪽 이동">←</button
        ><button data-dir="down" aria-label="아래로 이동">↓</button
        ><button data-dir="right" aria-label="오른쪽 이동">→</button>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
