<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>무기 테스트 · 다람이의 모험 2</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/lab.css" />
  </head>
  <body class="lab-page">
    <header class="lab-header">
      <div>
        <small>DEVELOPER PLAYGROUND</small>
        <h1>무기 테스트</h1>
      </div>
      <a href="/">← 시작 화면</a>
    </header>
    <main class="lab-layout">
      <aside class="lab-controls">
        <label
          >연차 / 맵
          <select id="lab-year">
            <option value="1">1년차 · 귀환의 숲</option>
            <option value="2">2년차 · 물길 너머의 숲</option>
            <option value="3">3년차 · 오래된 뿌리의 숲</option>
          </select></label
        >
        <label>계절 미리보기<select id="lab-season"><option value="0">봄</option><option value="1">여름</option><option value="2">가을</option><option value="3">겨울</option></select></label>
        <h2>무기 선택</h2>
        <p>선택 즉시 교체 · 전투 기록과 저장에 영향 없음</p>
        <div id="lab-weapons" class="lab-weapons"></div>
        <label class="lab-check"
          ><input id="lab-stack" type="checkbox" /> 추가 장착 모드 (최대
          6칸)</label
        >
        <label
          >선택한 무기 레벨 <output id="lab-level-value"></output
          ><input id="lab-level" type="range" min="1" max="8" value="1"
        /></label>
        <p id="lab-description"></p>
        <div class="lab-row">
          <button id="lab-max">장착 무기 최대 강화</button
          ><button id="lab-clear">무기 비우기</button>
        </div>
        <h2>표적 설정</h2>
        <label
          >행동
          <select id="lab-target">
            <option value="dummy">고정 표적 (체력 100,000)</option>
            <option value="snake">뱀</option>
            <option value="fox">여우</option>
            <option value="mushroom">버섯</option>
            <option value="bat">박쥐</option>
            <option value="boar">멧돼지</option>
            <option value="boss">이 연차의 보스</option>
          </select></label
        >
        <label
          >개수
          <select id="lab-count">
            <option>1</option>
            <option selected>4</option>
            <option>10</option>
            <option>30</option>
          </select></label
        >
        <label
          >배치 거리 <output id="lab-distance-value">110</output
          ><input
            id="lab-distance"
            type="range"
            min="50"
            max="420"
            step="10"
            value="110"
        /></label>
        <div class="lab-row">
          <button id="lab-spawn">표적 재배치</button
          ><button id="lab-hit">피격 테스트</button>
        </div>
        <h2>패시브</h2>
        <div id="lab-passives"></div>
        <div class="lab-row">
          <button id="lab-reset">테스트 초기화</button
          ><button id="lab-pause">일시정지</button>
        </div>
        <p id="lab-status" role="status">
          WASD / 방향키 이동 · 포자는 움직여야 생성됩니다.
        </p>
      </aside>
      <section class="lab-play">
        <div class="lab-stage">
          <canvas
            id="game"
            tabindex="0"
            aria-label="무기 테스트 필드. WASD 또는 방향키로 이동"
          ></canvas>
          <div class="lab-caption">
            훈련 중에는 사망하지 않습니다 · 자동 몹 생성 / 레벨업 없음
          </div>
        </div>
        <div id="lab-equipped" class="lab-equipped"></div>
        <div class="lab-row">
          <h2>실시간 측정</h2>
          <button id="lab-stats-reset">측정 초기화</button>
        </div>
        <div id="lab-metrics" aria-live="off"></div>
        <p>
          피격 테스트는 부적 차단·재충전을 확인합니다. 장착 목록을 누르면 해당
          무기를 제거합니다. 몬스터 처치 후 ‘표적 재배치’를 눌러 계속
          시험하세요.
        </p>
      </section>
    </main>
    <script type="module" src="/src/lab.js"></script>
  </body>
</html>
